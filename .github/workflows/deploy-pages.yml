name: Deploy Mubahat Visuals to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Prepare production site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude '.pages.yml' \
            --exclude 'README.md' \
            --exclude 'GITHUB-PAGES-SETUP.md' \
            --exclude 'CLIENT-WORK-UPLOAD-GUIDE.md'
          python3 - <<'PY'
          import os
          from pathlib import Path
          site_url = os.environ['SITE_URL'].rstrip('/')
          path = Path('_site/index.html')
          html = path.read_text(encoding='utf-8').replace('__SITE_URL__', site_url)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
